services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: crm-oracle-free
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=ChangeMeDevPassword123!
      - APP_USER=crm_dev
      - APP_USER_PASSWORD=ChangeMeDevPassword123!
      - ORACLE_DATABASE=FREEPDB1
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s crm_dev/ChangeMeDevPassword123!@localhost:1521/FREEPDB1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  oracle-data:
    driver: local
